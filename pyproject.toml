# Astromer 2 + Multi-Head Latent Attention (MHLA), AGN/quasar regression study.
#
# This is the TensorFlow environment (the old conda env `astromer`).
# It is a "virtual" project: nothing here is installed as a package, because the
# repo is imported from the root as namespace packages (`src...`,
# `presentation.pipelines...`). Run everything from the repo root.
#
#   uv sync                 # create/update .venv
#   uv run python -m presentation.pipelines.pipeline_0.pretrain --help
#
# The GPU regression env lives in envs/agn-torch/ (GPU torch build). Both now
# use CUDA 12 and numpy 2, so they could probably be merged; not yet tried.

[project]
name = "astromer-mhla"
version = "0.1.0"
description = "Astromer 2 with Multi-Head Latent Attention, plus an AGN/quasar regression study"
readme = "README.md"
# TensorFlow 2.21 publishes wheels for cp310-cp313. tf.keras is Keras 3 there.
# Checkpoints written by TF 2.14 / Keras 2 still load: load_weights_compat()
# in presentation/pipelines/steps/model_design.py renames their HDF5 paths.
requires-python = "==3.12.*"

dependencies = [
    # --- core model stack -----------------------------------------------
    "tensorflow==2.21.0",
    # The and-cuda extra brings TF's CUDA 12 / cuDNN 9 libraries as pip wheels
    # (it no longer pulls in tensorrt, which once pinned this project to cp310).
    # Linux only: NVIDIA publishes no macOS wheels, and TF has no CUDA there, so
    # a Mac gets a CPU-only TF from the plain wheel.
    "tensorflow[and-cuda]==2.21.0; sys_platform == 'linux'",
    "numpy==2.4.6",
    # TF 2.21 no longer depends on tensorboard. Training writes its logs with
    # tf.summary (TF itself); this is only for viewing them.
    "tensorboard==2.21.0",
    # CPU build only: this is imported before TF to read WebDataset .tar.gz
    # shards (src/data/loaders.py), never to compute.
    "torch==2.11.0",

    # --- data / analysis ------------------------------------------------
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "polars==0.20.10",
    "pyarrow==22.0.0",
    "h5py==3.14.0",  # TF 2.21 requires h5py < 3.15
    "toml==0.10.2",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "psutil==7.1.3",

    # --- plotting -------------------------------------------------------
    "matplotlib==3.10.7",
    "seaborn==0.13.2",

    # --- catalog crossmatching (crossmatch_labels.py, survivor_overlap.py)
    # These were only ever in the conda `base` env, so those scripts needed a
    # different interpreter. Folding them in makes one env run everything.
    # astropy 7 requires Python >= 3.11, hence the <7 bound.
    "astropy>=6.1,<7",
    "pyvo>=1.5",

    # --- dataset download (data/get_data.sh calls the `gdown` CLI) --------
    "gdown==5.2.0",
    "pydrive==1.3.1",
]

[project.optional-dependencies]
# Jupyter: not needed for cluster jobs.  uv sync --extra notebook
notebook = [
    "notebook==7.4.7",
    "jupyterlab==4.4.10",
]
# presentation/pipelines/utils.py imports mlflow, but nothing imports that
# module -- it is dead code, and mlflow was already broken (import failed) in
# the conda env. Kept available, but out of the default install: it pulls in
# ~50 packages (flask, gunicorn, alembic, sqlalchemy, docker, fastapi, ...).
mlflow = ["mlflow==3.6.0"]
dev = ["pytest>=8"]

[tool.uv]
# Do not try to build/install this repo as a distribution; only manage deps.
package = false

# The CPU torch build is not on PyPI; it comes from PyTorch's own index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
